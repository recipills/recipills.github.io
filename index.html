<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes ── */
    :root, [data-theme="light"] {
      --bg:        #ffffff;
      --bg2:       #f5f5f5;
      --bg3:       #ebebeb;
      --surface:   #ffffff;
      --surface2:  #f9f9f9;
      --border:    #e8e8e8;
      --border2:   #d4d4d4;
      --text:      #111111;
      --text2:     #555555;
      --text3:     #999999;
      --accent:    #111111;
      --accent-fg: #ffffff;
      --shadow:    0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.10);
      --header-bg: #111111;
      --header-fg: #ffffff;
      --header-sub:#888888;
      --badge-border: #333333;
    }

    [data-theme="colour"] {
      --bg:        #fef9f0;
      --bg2:       #fdf0e0;
      --bg3:       #fae3c8;
      --surface:   #ffffff;
      --surface2:  #fef9f0;
      --border:    #f0dfc8;
      --border2:   #e8cfaf;
      --text:      #1a1208;
      --text2:     #5a4030;
      --text3:     #a08060;
      --accent:    #e8500a;
      --accent-fg: #ffffff;
      --shadow:    0 1px 4px rgba(100,40,0,0.06), 0 4px 16px rgba(100,40,0,0.05);
      --shadow-lg: 0 4px 24px rgba(100,40,0,0.12);
      --header-bg: #e8500a;
      --header-fg: #ffffff;
      --header-sub: rgba(255,255,255,0.65);
      --badge-border: rgba(255,255,255,0.4);
    }

    /* ── Base ── */
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .site-header {
      background: var(--header-bg);
      color: var(--header-fg);
      padding: 2.5rem 2rem 2rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-left {}
    .site-title {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--header-fg);
      line-height: 1.1;
    }
    .site-subtitle {
      margin-top: 0.35rem;
      font-size: 0.875rem;
      color: var(--header-sub);
      letter-spacing: 0.01em;
      font-weight: 300;
    }
    .recipe-count-badge {
      display: inline-block;
      margin-top: 0.85rem;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--badge-border);
      border-radius: 100px;
      font-size: 0.8125rem;
      color: var(--header-sub);
      font-family: 'DM Mono', monospace;
    }

    /* Theme toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: 1px solid var(--badge-border);
      border-radius: 100px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      color: var(--header-sub);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .theme-toggle:hover { background: rgba(255,255,255,0.1); }
    .theme-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--header-sub);
      transition: background 0.2s;
    }
    [data-theme="colour"] .theme-dot { background: #ffd080; }

    /* ── Controls ── */
    .controls-bar {
      position: sticky; top: 0; z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.5rem;
      display: flex; gap: 0.625rem; flex-wrap: wrap; align-items: center;
      box-shadow: var(--shadow);
    }

    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-icon {
      position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
      color: var(--text3); pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 0.625rem 0.75rem 0.625rem 2.375rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-input:focus { border-color: var(--accent); background: var(--surface); }
    .search-input::placeholder { color: var(--text3); }

    .filters { display: flex; gap: 0.375rem; flex-wrap: wrap; align-items: center; }
    .filter-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text3); font-weight: 500; margin-right: 0.125rem;
    }
    .pill {
      padding: 0.375rem 0.875rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .pill:hover { border-color: var(--border2); color: var(--text); background: var(--bg2); }
    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 500;
    }

    /* ── Results bar ── */
    .results-bar {
      padding: 0.625rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.875rem; color: var(--text3);
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .sort-select {
      background: none; border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem; color: var(--text2);
      cursor: pointer; outline: none;
    }

    /* ── Grid ── */
    .grid-wrap { padding: 1.5rem; }
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex; flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border2);
    }
    .card-stripe { height: 3px; flex-shrink: 0; }
    .card-body { padding: 1.125rem 1.25rem 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 0; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .card-cat {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text3); font-weight: 500;
    }
    .card-cuisine { font-size: 0.8125rem; color: var(--text3); }
    .card-title {
      font-size: 1.0625rem; font-weight: 600; line-height: 1.3;
      margin-bottom: 0.375rem; color: var(--text);
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 0.9375rem; color: var(--text2); line-height: 1.5;
      margin-bottom: 0.875rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      flex: 1;
    }
    .card-footer { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .meta { display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem; color: var(--text3); }

    .card-macros {
      display: flex; gap: 0.75rem; flex-wrap: wrap;
      margin-top: 0.75rem; padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .card-macro { font-size: 0.8125rem; color: var(--text3); }
    .card-macro strong { color: var(--text2); font-weight: 500; font-family: 'DM Mono', monospace; font-size: 0.75rem; }

    .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.625rem; }
    .tag {
      padding: 0.15rem 0.5rem;
      background: var(--bg2); border-radius: 100px;
      font-size: 0.75rem; color: var(--text3);
    }

    /* ── States ── */
    .state-box { text-align: center; padding: 5rem 2rem; color: var(--text3); }
    .state-box h3 { font-size: 1.375rem; font-weight: 500; color: var(--text2); margin-bottom: 0.5rem; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 1rem;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal overlay ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200; align-items: center; justify-content: center;
      padding: 1rem; backdrop-filter: blur(4px);
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      max-width: 860px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: slideUp 0.18s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-stripe { height: 4px; border-radius: 12px 12px 0 0; flex-shrink: 0; }
    .modal-inner { padding: 2rem 2rem 2.5rem; }

    .modal-close {
      float: right; margin: 0 0 1rem 1rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.375rem 0.625rem;
      cursor: pointer; font-size: 1rem; color: var(--text2);
      line-height: 1; transition: all 0.15s; font-family: inherit;
    }
    .modal-close:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    .modal-meta {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text3); font-weight: 500; margin-bottom: 0.375rem;
    }
    .modal-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 600; line-height: 1.15;
      margin-bottom: 0.625rem;
      letter-spacing: -0.02em;
    }
    .modal-desc {
      color: var(--text2); line-height: 1.65;
      margin-bottom: 1.25rem; font-size: 1rem;
    }

    /* stats + serving row */
    .modal-stats {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      padding: 1rem 1.25rem;
      background: var(--bg2); border-radius: 8px;
      margin-bottom: 1rem; align-items: center;
      border: 1px solid var(--border);
    }
    .stat { text-align: center; }
    .stat-val {
      font-family: 'DM Mono', monospace;
      font-size: 1.25rem; font-weight: 500;
      color: var(--text); line-height: 1;
    }
    .stat-lbl {
      font-size: 0.6875rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text3); margin-top: 0.2rem;
    }

    .serving-control { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
    .serving-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); }
    .serving-btns {
      display: flex; border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden;
    }
    .srv-btn {
      padding: 0.3rem 0.6rem; background: var(--surface); border: none;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500;
      color: var(--text2); cursor: pointer; transition: all 0.12s;
    }
    .srv-btn:hover { background: var(--bg2); }
    .srv-btn.active { background: var(--accent); color: var(--accent-fg); }
    .srv-btn + .srv-btn { border-left: 1px solid var(--border); }

    /* macros panel */
    .macros-panel {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.5rem; padding: 0.875rem 1.125rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 0.5rem;
    }
    .macro-cell { text-align: center; }
    .macro-val {
      font-family: 'DM Mono', monospace;
      font-size: 1rem; font-weight: 500; color: var(--text); line-height: 1;
    }
    .macro-val.kcal-val { font-size: 1.25rem; color: var(--accent); }
    .macro-lbl { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-top: 0.2rem; }
    .macros-note { font-size: 0.75rem; color: var(--text3); text-align: right; margin-bottom: 1rem; }

    .modal-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }

    /* two-col layout */
    .modal-cols { display: grid; grid-template-columns: 1fr 1.6fr; gap: 2rem; margin-bottom: 1.5rem; }
    @media (max-width: 580px) { .modal-cols { grid-template-columns: 1fr; gap: 1.5rem; } }

    .modal-section h3 {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.09em;
      font-weight: 600; color: var(--text3);
      margin-bottom: 0.75rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* ingredients */
    .ingredients-list { list-style: none; }
    .ingredients-list li {
      padding: 0.5rem 0; font-size: 1rem; color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    .ingredients-list li:last-child { border-bottom: none; }
    .ing-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    .ing-text { color: var(--text); }
    .ing-macros { display: flex; gap: 0.375rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; margin-top: 0.1rem; }
    .ing-m { font-size: 0.6875rem; color: var(--text3); white-space: nowrap; font-family: 'DM Mono', monospace; }
    .ing-m strong { color: var(--text2); font-weight: 500; }

    /* steps */
    .steps-list { list-style: none; display: flex; flex-direction: column; gap: 1rem; counter-reset: steps; }
    .steps-list li {
      font-size: 1rem; color: var(--text2); line-height: 1.6;
      display: flex; gap: 1rem; align-items: flex-start;
      counter-increment: steps;
    }
    .steps-list li::before {
      content: counter(steps);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem; font-weight: 500;
      color: var(--text3);
      min-width: 1.25rem; text-align: right;
      line-height: 1.7; flex-shrink: 0;
    }

    .modal-notes {
      padding: 0.875rem 1.125rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; font-size: 1rem; color: var(--text2); line-height: 1.6;
    }
    .modal-notes strong { color: var(--text); font-weight: 500; }
    .modal-source { margin-top: 1.5rem; font-size: 0.875rem; color: var(--text3); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .controls-bar { padding: 0.75rem 1rem; }
      .grid-wrap { padding: 1rem; }
      .modal-inner { padding: 1.25rem 1.25rem 2rem; }
      .modal-stats { gap: 1rem; }
      .serving-control { margin-left: 0; margin-top: 0.5rem; }
      .site-header { padding: 1.75rem 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="header-left">
    <h1 class="site-title">Recipe Library</h1>
    <p class="site-subtitle">A personal collection</p>
    <div class="recipe-count-badge" id="count-badge">—</div>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Switch theme">
    <span class="theme-dot"></span>
    <span id="theme-label">Colour theme</span>
  </button>
</header>

<!-- Controls -->
<div class="controls-bar">
  <div class="search-wrap">
    <span class="search-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
    <input class="search-input" id="search" type="search" placeholder="Search recipes, ingredients, cuisine…" />
  </div>
  <div class="filters" id="category-filters">
    <span class="filter-label">Filter</span>
  </div>
</div>

<!-- Results bar -->
<div class="results-bar">
  <span id="results-count"></span>
  <select class="sort-select" id="sort-select">
    <option value="title">A – Z</option>
    <option value="time">Quickest first</option>
    <option value="kcal">Lowest calorie</option>
    <option value="category">By category</option>
  </select>
</div>

<!-- Grid -->
<main class="grid-wrap">
  <div id="loading" class="state-box"><div class="spinner"></div><p>Loading…</p></div>
  <div class="recipe-grid" id="grid" style="display:none"></div>
  <div id="empty" class="state-box" style="display:none">
    <h3>No recipes found</h3>
    <p>Try a different search or filter</p>
  </div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-stripe" id="modal-stripe"></div>
    <div class="modal-inner" id="modal-inner"></div>
  </div>
</div>

<script>
  const BASE = '';

  const CAT_COLOURS = {
    breakfast: '#f59e0b', lunch:  '#10b981', dinner:  '#6366f1',
    snack:     '#f97316', dessert:'#ec4899', drink:   '#06b6d4',
    side:      '#84cc16', sauce:  '#ef4444', other:   '#94a3b8',
  };
  const catCol = c => CAT_COLOURS[(c||'other').toLowerCase()] || '#94a3b8';

  // ── Theme toggle ──
  const themes = ['light', 'colour'];
  const labels = { light: 'Colour theme', colour: 'Light theme' };
  let currentTheme = localStorage.getItem('recipe-theme') || 'light';
  applyTheme(currentTheme);

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const lbl = document.getElementById('theme-label');
    if (lbl) lbl.textContent = labels[t];
    localStorage.setItem('recipe-theme', t);
    currentTheme = t;
  }
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
    applyTheme(next);
  });

  // ── State ──
  let allRecipes = [];
  let activeCategory = 'All';
  let activeSearch = '';
  let activeSort = 'title';
  let currentRecipe = null;
  let currentMultiplier = 1;

  // ── Load ──
  async function loadAll() {
    try {
      const res = await fetch(`${BASE}/recipes/index.json`);
      const ids = await res.json();
      const recipes = await Promise.all(
        ids.map(id => fetch(`${BASE}/recipes/${id}.json`).then(r => r.json()).catch(() => null))
      );
      allRecipes = recipes.filter(Boolean);
      document.getElementById('count-badge').textContent =
        `${allRecipes.length} recipe${allRecipes.length !== 1 ? 's' : ''}`;
      buildCategoryFilters();
      renderGrid();
    } catch(e) {
      document.getElementById('loading').innerHTML =
        `<h3>Couldn't load recipes</h3><p style="color:#e07070;font-size:1rem">${e.message}</p>`;
    }
  }

  // ── Category filters ──
  function buildCategoryFilters() {
    const cats = ['All', ...new Set(allRecipes.map(r => r.category).filter(Boolean).sort())];
    const container = document.getElementById('category-filters');
    const label = container.querySelector('.filter-label');
    container.innerHTML = ''; container.appendChild(label);
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'pill' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat;
      btn.onclick = () => {
        activeCategory = cat;
        container.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      };
      container.appendChild(btn);
    });
  }

  document.getElementById('search').addEventListener('input', e => { activeSearch = e.target.value; renderGrid(); });
  document.getElementById('sort-select').addEventListener('change', e => { activeSort = e.target.value; renderGrid(); });

  // ── Filter + sort ──
  function filtered() {
    const q = activeSearch.toLowerCase();
    return allRecipes.filter(r => {
      const matchSearch = !q
        || r.title?.toLowerCase().includes(q)
        || r.description?.toLowerCase().includes(q)
        || r.cuisine?.toLowerCase().includes(q)
        || r.ingredients?.some(i => (i.text||i).toLowerCase().includes(q))
        || r.tags?.some(t => t.toLowerCase().includes(q));
      const matchCat = activeCategory === 'All' || r.category === activeCategory;
      return matchSearch && matchCat;
    }).sort((a,b) => {
      if (activeSort === 'title')    return a.title.localeCompare(b.title);
      if (activeSort === 'time')     return ((a.prepTime||0)+(a.cookTime||0)) - ((b.prepTime||0)+(b.cookTime||0));
      if (activeSort === 'kcal')     return (a.macros?.kcal||9999) - (b.macros?.kcal||9999);
      if (activeSort === 'category') return (a.category||'').localeCompare(b.category||'');
      return 0;
    });
  }

  // ── Render grid ──
  function renderGrid() {
    const results = filtered();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('results-count').textContent =
      `${results.length} recipe${results.length !== 1 ? 's' : ''}`;
    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');
    if (!results.length) { grid.style.display = 'none'; empty.style.display = 'block'; return; }
    empty.style.display = 'none'; grid.style.display = 'grid';
    grid.innerHTML = results.map(cardHTML).join('');
    grid.querySelectorAll('.card').forEach((el,i) => el.addEventListener('click', () => openModal(results[i])));
  }

  function cardHTML(r) {
    const colour = catCol(r.category);
    const total  = (r.prepTime||0) + (r.cookTime||0);
    const tags   = (r.tags||[]).slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const m = r.macros;
    const macroStrip = m ? `
      <div class="card-macros">
        <span class="card-macro"><strong>${m.kcal}</strong> kcal</span>
        <span class="card-macro"><strong>${m.protein}g</strong> P</span>
        <span class="card-macro"><strong>${m.carbs}g</strong> C</span>
        <span class="card-macro"><strong>${m.fat}g</strong> F</span>
      </div>` : '';
    return `
      <article class="card">
        <div class="card-stripe" style="background:${colour}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="card-cat">${esc(r.category||'Other')}</span>
            <span class="card-cuisine">${esc(r.cuisine||'')}</span>
          </div>
          <h2 class="card-title">${esc(r.title)}</h2>
          <p class="card-desc">${esc(r.description||'')}</p>
          <div class="card-footer">
            ${total ? `<span class="meta">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${total}m</span>` : ''}
            ${r.servings ? `<span class="meta">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              ${r.servings}</span>` : ''}
          </div>
          ${macroStrip}
          ${tags ? `<div class="card-tags">${tags}</div>` : ''}
        </div>
      </article>`;
  }

  // ── Modal ──
  const MULTIPLIERS = [0.5, 1, 2, 3];

  function openModal(r, mult) {
    currentRecipe = r;
    currentMultiplier = mult || 1;
    renderModal();
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderModal() {
    const r = currentRecipe;
    const x = currentMultiplier;
    const colour = catCol(r.category);
    const total  = (r.prepTime||0) + (r.cookTime||0);

    const stats = [
      r.prepTime ? `<div class="stat"><div class="stat-val">${r.prepTime}m</div><div class="stat-lbl">Prep</div></div>` : '',
      r.cookTime ? `<div class="stat"><div class="stat-val">${r.cookTime}m</div><div class="stat-lbl">Cook</div></div>` : '',
      total      ? `<div class="stat"><div class="stat-val">${total}m</div><div class="stat-lbl">Total</div></div>` : '',
      r.servings ? `<div class="stat"><div class="stat-val">${Math.round(r.servings*x)}</div><div class="stat-lbl">Serves</div></div>` : '',
    ].join('');

    const srvBtns = MULTIPLIERS.map(m =>
      `<button class="srv-btn${x===m?' active':''}" data-mult="${m}">${m===0.5?'½':m+'×'}</button>`
    ).join('');

    let macrosPanel = '';
    if (r.macros) {
      const m = r.macros;
      const s = v => v != null ? Math.round(v*x) : '–';
      macrosPanel = `
        <div class="macros-panel">
          <div class="macro-cell"><div class="macro-val kcal-val">${s(m.kcal)}</div><div class="macro-lbl">kcal</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.protein)}g</div><div class="macro-lbl">Protein</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.carbs)}g</div><div class="macro-lbl">Carbs</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.fat)}g</div><div class="macro-lbl">Fat</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.satFat)}g</div><div class="macro-lbl">Sat Fat</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.fibre)}g</div><div class="macro-lbl">Fibre</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.sugar)}g</div><div class="macro-lbl">Sugar</div></div>
          <div class="macro-cell"><div class="macro-val">${s(m.iron)}mg</div><div class="macro-lbl">Iron</div></div>
        </div>
        <p class="macros-note">Per serving · ballpark estimates</p>`;
    }

    const ingredients = (r.ingredients||[]).map(ing => {
      if (typeof ing === 'string') return `<li><span class="ing-text">${esc(ing)}</span></li>`;
      const sc = v => v != null ? Math.round(v*x) : null;
      const kcal = sc(ing.kcal), p = sc(ing.protein), c = sc(ing.carbs), f = sc(ing.fat), sf = sc(ing.satFat);
      const hasMacros = kcal || p || c || f;
      return `<li>
        <div class="ing-row">
          <span class="ing-text">${esc(ing.text)}</span>
          ${hasMacros ? `<span class="ing-macros">
            <span class="ing-m"><strong>${kcal}</strong>kcal</span>
            <span class="ing-m"><strong>${p}g</strong>P</span>
            <span class="ing-m"><strong>${c}g</strong>C</span>
            <span class="ing-m"><strong>${f}g</strong>F</span>
            ${sf ? `<span class="ing-m"><strong>${sf}g</strong>SF</span>` : ''}
          </span>` : ''}
        </div>
      </li>`;
    }).join('');

    const steps = (r.steps||[]).map(s => `<li>${esc(s)}</li>`).join('');
    const tags  = (r.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');

    document.getElementById('modal-stripe').style.background = colour;
    document.getElementById('modal-inner').innerHTML = `
      <button class="modal-close" id="modal-close-btn" aria-label="Close">✕</button>
      <p class="modal-meta">${esc(r.category||'')} · ${esc(r.cuisine||'')}</p>
      <h2 class="modal-title">${esc(r.title)}</h2>
      ${r.description ? `<p class="modal-desc">${esc(r.description)}</p>` : ''}
      <div class="modal-stats">
        ${stats}
        <div class="serving-control">
          <span class="serving-label">Servings</span>
          <div class="serving-btns">${srvBtns}</div>
        </div>
      </div>
      ${macrosPanel}
      ${tags ? `<div class="modal-tags">${tags}</div>` : ''}
      <div class="modal-cols">
        <div class="modal-section"><h3>Ingredients</h3><ul class="ingredients-list">${ingredients}</ul></div>
        <div class="modal-section"><h3>Method</h3><ol class="steps-list">${steps}</ol></div>
      </div>
      ${r.notes  ? `<div class="modal-notes"><strong>Notes</strong> — ${esc(r.notes)}</div>` : ''}
      ${r.source ? `<p class="modal-source">Source: ${esc(r.source)}</p>` : ''}
    `;

    document.getElementById('modal-close-btn').onclick = closeModal;
    document.querySelectorAll('.srv-btn').forEach(btn => {
      btn.onclick = () => { currentMultiplier = parseFloat(btn.dataset.mult); renderModal(); };
    });
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
    currentRecipe = null; currentMultiplier = 1;
  }

  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function esc(str) {
    return String(str??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadAll();
</script>
</body>
</html>
